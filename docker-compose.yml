services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/pdf_qa_agent/data
      - .:/app/pdf_qa_agent
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/pdf_qa_agent/data
      - SQLALCHEMY_DATABASE_URL=sqlite:////app/pdf_qa_agent/data/pdf_qa.db
      - ENABLE_GEMINI=${ENABLE_GEMINI:-false}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_EXTRACT_MODEL=${GEMINI_EXTRACT_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_SOLVE_MODEL=${GEMINI_SOLVE_MODEL:-gemini-3.1-pro-preview}
      - ENABLE_GROQ=${ENABLE_GROQ:-false}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GROQ_VISION_MODEL=${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      - GROQ_SOLVE_MODEL=${GROQ_SOLVE_MODEL:-qwen/qwen3.8-27b}
      - CORRECTION_LLM_PROVIDER=${CORRECTION_LLM_PROVIDER:-groq}
      - GROQ_CORRECTION_MODEL=${GROQ_CORRECTION_MODEL:-qwen/qwen3.8-27b}
      - GEMINI_CORRECTION_MODEL=${GEMINI_CORRECTION_MODEL:-gemini-3.1-flash-lite}
      - ENABLE_ANSWER_VALIDATION=${ENABLE_ANSWER_VALIDATION:-true}
      - ENABLE_WORD_CORRECTION=${ENABLE_WORD_CORRECTION:-true}
      - ENABLE_CORRECTION=${ENABLE_CORRECTION:-true}
      - ENABLE_MATH_OCR=${ENABLE_MATH_OCR:-true}
      - MATH_OCR_ENGINE=${MATH_OCR_ENGINE:-auto}
      - ENABLE_QUESTION_OCR=${ENABLE_QUESTION_OCR:-true}
      - QUESTION_OCR_ENGINE=${QUESTION_OCR_ENGINE:-groq}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-examportal}
      - R2_CUSTOM_DOMAIN=${R2_CUSTOM_DOMAIN:-https://examcdn.trogon.info}

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
